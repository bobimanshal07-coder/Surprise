<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, touch-action=none">
  <title>Birthday Surprise for Riya 🎉</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    @keyframes float { 0% { transform: translateY(0); } 100% { transform: translateY(-100vh); opacity: 0; } }
    @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: manipulation;
      overflow: hidden; /* Fixes "fit to screen" and prevents user scrolling */
    }
    #root {
      width: 100vw; height: 100vh; overflow-y: auto; overflow-x: hidden;
      display: flex; items-center justify-center; p-4;
    }
    .fp-scanner { position: relative; width: 120px; height: 120px; border: 4px solid #ff3366; border-radius: 50%; overflow: hidden; }
    .fp-image { width: 100%; height: 100%; object-fit: cover; }
    .scan-line { position: absolute; width: 100%; height: 6px; background: red; top: 0; animation: scan 2s linear infinite; box-shadow: 0 0 10px red; }
    .floating-balloon { position: fixed; bottom: -50px; font-size: 2.5rem; animation: float 10s linear infinite; pointer-events: none; }
  </style>
</head>
<body class="min-h-screen">

  <div id="root">
    <div id="card" class="bg-white p-6 rounded-3xl shadow-xl text-center border border-pink-100 w-full max-w-md my-auto"></div>
  </div>

  <script>
    // Step 2: Initialize EmailJS with your User ID (Get from EmailJS dashboard)
    // emailjs.init("YOUR_EMAILJS_USER_ID");

    let step = 1;
    let holdProgress = 0;
    let holdInterval = null;
    let photos = [
      { src: 'images/photo1.jpg', caption: 'Sweet Memory 💗' },
      { src: 'images/photo2.jpg', caption: 'Sweet Memory 💗' },
      { src: 'images/photo3.jpg', caption: 'Sweet Memory 💗' },
      { src: 'images/photo4.jpg', caption: 'Sweet Memory 💗' },
      { src: 'images/photo5.jpg', caption: 'Sweet Memory 💗' },
      { src: 'images/photo6.jpg', caption: 'Sweet Memory 💗' }
    ];
    let activePhotoIdx = 0;

    const relQuestions = [
      { q: '😌 Main jiddan da haan, tenu oh genuine lagda ya thoda zyada hi pagal?', options: [{ text: 'Genuine ❤️', react: 'Aww! Tusi vi bhot pyare ho! 🥺❤️' }, { text: 'Cute pagal 😂', react: 'Haha! Pagal taan haan par sirf tere layi! 🤪' }, { text: 'Dono da mixture 😌', react: 'Best combination lagda fer taan! ✨' }] },
      { q: '🫢 Meri kehdi gall ya aadat tenu kade-kade awkward ya annoying lagdi aa?', options: [{ text: 'Baar-baar puchhna "ki hoya?" 😭', react: 'Care karda haan islayi puchhda haan! 🥺' }, { text: 'Thodi zyada care karna 😂', react: 'Care thodi zyada hi honi chahidi aa! 🥰' }, { text: 'Meri overthinking 😌', react: 'Aage ton ghata devanga overthinking! 🧠' }, { text: 'Kujh hor… 👀', react: 'Mainu dssna zaroor fer baad vich! 😂' }] },
      { q: '🥹 Je by chance main tere naal gall karni band kar dawaan, ya sade vich koi misunderstanding ho jaave… tu aap mere naal gall karan di try karegi?', options: [{ text: 'Haan ji, zaroor ❤️', react: 'Eh sun ke dil nu sukoon mileya! ❤️' }, { text: 'Pehla gussa karungi, fer aap gall karangi 😂', react: 'Thoda gussa vi zaroori aa! 😜' }, { text: 'Situation te depend karega 😌', react: 'Fair enough! Par gall kar leya karo! 🥹' }, { text: 'Apna answer likhungi ✍️', react: 'Aapda answer likh ke batao fer! 📝' }] },
      { q: '🫶 Meri care ya meri gallan vichon kehdi cheez tenu sab ton zyada feel hundi aa ki "haan, eh banda genuinely care karda"?', options: [{ text: 'Baar-baar tera haal puchhna ❤️', react: 'Tuhadi health/mood sab ton pehla! 🫶' }, { text: 'Tere chhote-chhote details yaad rakhna 🥹', react: 'Har choti gall yaad rehndi aa mainu! ✨' }, { text: 'Tere dreams te future nu seriously lena 💗', react: 'Tuhade supne mere supne han! 🌈' }, { text: 'Apna answer likhungi ✍️', react: 'Kujh khas hi hona fer taan! ❤️' }] },
      { q: '💗 Last question: main jiddan da haan, ohnu change karna chaundi aa ya eda hi theek aa?', options: [{ text: 'Eda hi ❤️', react: 'Bestest! Main vi eda hi rahunga! ❤️' }, { text: 'Thoda jeha change 😂', react: 'Chalo thoda adjust kar lavange! 😉' }, { text: 'Bilkul change nahi 🥹', react: 'Thank you for accepting me as I am! 💖' }, { text: 'Mainu sochan de 😌', react: 'Time lao, soch ke dasso! ⏱️' }] }
    ];

    let relIndex = 0;
    let relAnswers = [];

    const comQuestions = [
      { q: '😊 Apni sohni smile hamesha maintain rakhegi?', options: ['Haan ji, hamesha ❤️', 'Koshish poori rahugi 🥰', 'Reason tusi dinde rehna 😌'] },
      { q: '🫶 Apni health da changi tarah dhyaan rakhegi?', options: ['Haan ji 💗', 'Hun ton pakka 😌', 'Tusi reminder dinde rehna 😂'] },
      { q: '💗 Tu kade vi apne aap nu kise ton ghatt nahi samjhegi?', options: ['Haan ji, kade vi nahi ❤️', 'Mainu pata aa meri value 😌', 'Tusi yaad karwa dinde rehna 😂', 'Eh taan pakka aa 🥰'] },
      { q: '😂 Birthday party kadon deni aa?', options: ['Jaldi hi 🎂❤️', 'Milange odo party pakki 😌', 'Google Pay available nahi hai 😂', 'Tusi aayo, fer party dungi 😌❤️', 'Apna answer likhungi ✍️'] },
      { q: '🌱 Apne future layi mehnat karna kabhi give up nahi karegi?', options: ['Never ❤️', 'Thak sakdi aa, rukangi nahi 💪', 'Tusi motivation dinde rehna 😭😂', 'Apna answer likhungi ✍️'] }
    ];

    let comIndex = 0;
    let comAnswers = [];
    let canvasRef = { current: null };
    let isDrawing = false;
    let hasSigned = false;
    let cakeClicks = 0;

    function render() {
      const card = document.getElementById('card');

      if (step === 1) {
        card.innerHTML = `
          <div class="text-6xl mb-3">🐒✉️</div>
          <h2 class="text-2xl font-bold text-pink-600 mb-2">A Special Wish For Riya ✨</h2>
          <p class="text-gray-600 mb-6">Tuhade layi ek chhota jeha pyara surprise!</p>
          <button class="bg-pink-500 text-white px-6 py-3 rounded-full font-semibold active:scale-95 transition" onClick="setStep(2)">Open Letter 💌</button>
        `;
      } else if (step === 2) {
        card.innerHTML = `
          <h2 class="text-2xl font-bold text-pink-600 mb-6">Are You Ready For The Surprise? 💗</h2>
          <button class="bg-pink-500 text-white px-6 py-3 rounded-full font-semibold active:scale-95 transition" onClick="setStep(3)">Yes, I am Ready! ✨</button>
        `;
      } else if (step === 3) {
        card.innerHTML = `
          <h2 class="text-xl font-bold text-gray-800 mb-2">🔐 Biometric Verification</h2>
          <p class="text-sm text-gray-500 mb-4">Click and hold the fingerprint scanner!</p>
          <div class="fp-scanner mx-auto mb-4" onMouseDown="startHold()" onMouseUp="endHold()" onTouchStart="startHold()" onTouchEnd="endHold()">
            <img src="https://static.thenounproject.com/png/3474320-200.png" alt="Fingerprint" class="fp-image"> <div class="scan-line"></div>
          </div>
          <div class="w-full bg-gray-200 h-3 rounded-full overflow-hidden mb-2">
            <div class="bg-pink-500 h-full transition-all duration-100" style="width: ${holdProgress}%"></div>
          </div>
          <p class="text-sm font-bold text-pink-500">${holdProgress}% (Keep holding...)</p>
        `;
      } else if (step === 4) {
        card.innerHTML = `
          <h1 class="text-3xl font-extrabold text-pink-600 mb-6">🎉 Happy Birthday Riya ❤️ 🎂</h1>
          <button class="bg-pink-500 text-white px-6 py-3 rounded-full font-semibold active:scale-95 transition" onClick="setStep(5)">Next ✨</button>
        `;
      } else if (step === 5) {
        card.innerHTML = `
          <div class="text-5xl mb-4">💌</div>
          <p class="text-gray-700 text-base mb-6">"Rabb kare tuhada eh saal khushiyan, achhi health te kamyabi naal bharya rahe. Hamesha eda hi smile karde raho! ✨❤️"</p>
          <button class="bg-pink-500 text-white px-6 py-3 rounded-full font-semibold active:scale-95 transition" onClick="setStep(6)">Chalo agge →</button>
        `;
      } else if (step === 6) {
        card.innerHTML = `
          <h2 class="text-xl font-bold text-pink-600">Some Sweet Moments 💗</h2>
          <p class="text-xs text-gray-400 mb-4">Swipe the cards</p>
          <img src="${photos[activePhotoIdx].src}" alt="Memory" class="w-full h-52 object-cover rounded-xl mb-3">
          <input type="text" value="${photos[activePhotoIdx].caption}" onchange="photos[${activePhotoIdx}].caption = this.value" class="w-full text-center border-b border-pink-300 focus:outline-none mb-4">
          <div class="flex items-center justify-center gap-4 my-4">
            <button class="bg-pink-500 text-white px-3 py-1 rounded-lg text-sm disabled:opacity-30" disabled="${activePhotoIdx === 0}" onClick="setActivePhotoIdx(${activePhotoIdx - 1})">◀</button>
            <span class="text-xs font-semibold text-gray-500">${activePhotoIdx + 1} / ${photos.length}</span>
            <button class="bg-pink-500 text-white px-3 py-1 rounded-lg text-sm disabled:opacity-30" disabled="${activePhotoIdx === photos.length - 1}" onClick="setActivePhotoIdx(${activePhotoIdx + 1})">▶</button>
          </div>
          <button class="bg-pink-500 text-white px-6 py-3 rounded-full font-semibold active:scale-95 transition w-full" onClick="setStep(7)">Agge Chalo →</button>
        `;
      } else if (step === 7) {
        card.innerHTML = `
          <h3>Question {relIndex + 1} / 5</h3>
          <p class="my-4">${relQuestions[relIndex].q}</p>
          ${relQuestions[relIndex].options.map((opt, i) => `<button class="w-full border border-pink-400 text-pink-600 rounded-xl py-2 mb-2 active:bg-pink-50" onClick="handleRelAnswer(${i})">${opt.text}</button>`).join('')}
        `;
      } else if (step === 8) {
        card.innerHTML = `
          <h3>Commitment {comIndex + 1} / 5</h3>
          <p class="my-4">${comQuestions[comIndex].q}</p>
          ${comQuestions[comIndex].options.map((opt, i) => `<button class="w-full border border-pink-400 text-pink-600 rounded-xl py-2 mb-2 active:bg-pink-50" onClick="handleComAnswer('${opt}')">${opt}</button>`).join('')}
        `;
      } else if (step === 9) {
        card.innerHTML = `
          <h2>📝 Commitment Agreement</h2>
          <div class="text-left bg-pink-50 p-3 rounded-xl text-xs space-y-2 mb-4">
            ${comAnswers.map((item, idx) => `<p><b>Q: {item.q}</b><br>Ans: {item.a}</p>`).join('')}
          </div>
          <p class="mb-2">Sign below (Riya):</p>
          <canvas id="sigCanvas" width="280" height="100" class="border border-dashed rounded-xl mb-4 mx-auto" onMouseDown="startDrawing(event)" onMouseMove="draw(event)" onMouseUp="stopDrawing()" onTouchStart="startDrawing(event)" onTouchMove="draw(event)" onTouchEnd="stopDrawing()"></canvas>
          ${hasSigned ? `<button class="bg-pink-500 text-white px-6 py-3 rounded-full font-semibold active:scale-95 transition w-full" onClick="setStep(10)">Accept & Share 🎉</button>` : ''}
        `;
        canvasRef.current = document.getElementById('sigCanvas');
      } else if (step === 10) {
        card.innerHTML = `
          <h2>Tap the Cake! 🎂</h2>
          <div class="text-7xl my-6 cursor-pointer select-none" onClick="handleCakeClick()">🎂✨</div>
          ${cakeClicks > 0 ? `<p>Happy Birthday Riya 🎂❤️<br>Love You ❤️ | Apna khayal rakhya kar 🫶</p>` : ''}
          ${cakeClicks >= 1 ? `<button class="bg-pink-500 text-white px-6 py-3 rounded-full font-semibold active:scale-95 transition w-full mt-4" onClick="setStep(11)">Final Surprise 🎁❤️</button>` : ''}
        `;
      } else if (step === 11) {
        card.innerHTML = `
          <img src="images/final.jpg" alt="Final Surprise" class="w-full rounded-2xl mb-4 object-cover">
          <p class="mb-6">Hamesha khush raho! Happy Birthday again Riya! ✨💗</p>
          <button class="bg-pink-500 text-white px-6 py-3 rounded-full font-semibold active:scale-95 transition w-full" onClick="setStep(12)">Close Option</button>
        `;
      } else if (step === 12) {
        card.innerHTML = `
          <h2>Finally Closed 🎉</h2>
          <p>Tuhade saare answers share ho gaye han te agreement signed hai! Have a blast! ❤️</p>
        `;
      }
    }

    function setStep(s) { step = s; render(); }
    function setActivePhotoIdx(i) { activePhotoIdx = i; render(); }

    function startHold() {
      holdInterval = setInterval(() => {
        holdProgress += 10; // Progress every second for approx 4-5 seconds total
        if (holdProgress >= 100) {
          clearInterval(holdInterval);
          setStep(4);
        } else {
          render();
        }
      }, 1000);
    }

    function endHold() {
      if (holdProgress < 100) {
        clearInterval(holdInterval);
        holdProgress = 0;
        render();
      }
    }

    function handleRelAnswer(i) {
      relAnswers.push({ q: relQuestions[relIndex].q, a: relQuestions[relIndex].options[i].text });
      if (relIndex < relQuestions.length - 1) { relIndex++; render(); } else { setStep(8); }
    }

    function handleComAnswer(ans) {
      comAnswers.push({ q: comQuestions[comIndex].q, a: ans });
      if (comIndex < comQuestions.length - 1) { comIndex++; render(); } else { setStep(9); }
    }

    function startDrawing(e) {
      if (!canvasRef.current) return;
      isDrawing = true; hasSigned = true;
      const ctx = canvasRef.current.getContext('2d');
      const rect = canvasRef.current.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      ctx.beginPath(); ctx.moveTo(x, y);
    }

    function draw(e) {
      if (!isDrawing || !canvasRef.current) return;
      const ctx = canvasRef.current.getContext('2d');
      const rect = canvasRef.current.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      ctx.strokeStyle = '#ff3366'; ctx.lineWidth = 3; ctx.lineTo(x, y); ctx.stroke();
    }

    function stopDrawing() { isDrawing = false; render(); } // Re-render to show "Share" button

    // Step 3: Enable answer sharing by filling in your EmailJS IDs and following their setup instructions
    function shareAnswersAndSignature() {
      const allAnswers = [...relAnswers, ...comAnswers];
      const answerText = allAnswers.map(a => `Q: {a.q}\nAns: {a.a}`).join('\n\n');
      
      const emailParams = {
        recipient_email: "YOUR_EMAIL_ADDRESS", // Enter your email here
        content: answerText,
        signature_image: canvasRef.current.toDataURL() // Sends signature as base64 image
      };

      // emailjs.send("YOUR_EMAILJS_SERVICE_ID", "YOUR_EMAILJS_TEMPLATE_ID", emailParams)
      //   .then(() => alert("Answers and signature shared successfully!"))
      //   .catch(err => alert("Error sharing: " + err));
    }

    function handleCakeClick() {
      cakeClicks++; confetti({ particleCount: 70 });
      for (let i = 0; i < 5; i++) {
        const balloon = document.createElement('div');
        balloon.className = 'floating-balloon'; balloon.innerText = i % 2 === 0 ? '🎈' : '❤️';
        balloon.style.left = (20 + i * 15) + 'vw'; balloon.style.animationDelay = (i * 0.5) + 's';
        document.body.appendChild(balloon); setTimeout(() => balloon.remove(), 10000);
      }
      render();
    }

    render();
  </script>
</body>
</html>
